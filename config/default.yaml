camera:
  focal_length_px: 721.5377
  baseline_m: 0.53715065
  cx: 609.5593
  cy: 172.8540

stereo:
  min_disparity: 0
  num_disparities: 128
  block_size: 5
  uniqueness_ratio: 10
  speckle_window_size: 100
  speckle_range: 2
  disp12_max_diff: 1
  use_wls_filter: true
  wls_lambda: 8000.0
  wls_sigma_color: 1.5

detection:
  # YOLO11m : meilleur compromis précision/temps pour ce PFE.
  # Utilisez yolo11l.pt uniquement avec un GPU NVIDIA puissant.
  model: yolo11m-seg.pt
  confidence: 0.35
  allowed_classes:
    - car
    - truck
    - bus
    - person
    - bicycle
    - motorcycle
    - cyclist

tracking:
  # StrongSORT conserve mieux les IDs après occultation grâce au ReID BoxMOT.
  # Installation requise : python -m pip install boxmot
  type: strongsort
  reid_device: cpu
  # Modèle ReID utilisé pour retrouver l'objet après une occultation.
  # BoxMOT le télécharge automatiquement au premier lancement si nécessaire.
  reid_weights: osnet_x0_25_msmt17.pt

semantic_stabilization:
  history_size: 12
  min_observations: 3
  min_majority_ratio: 0.60
  max_inactive_frames: 40

analysis_filter:
  enabled: true
  # Zone image qui correspond approximativement à la route devant le véhicule.
  road_x_min_ratio: 0.10
  road_x_max_ratio: 0.90
  road_y_min_ratio: 0.42
  road_y_max_ratio: 1.00
  # Pour la démonstration PFE, on analyse uniquement les objets qui avancent
  # dans le même sens que la voiture équipée de caméras.
  require_forward_motion: true
  # Sous ce seuil positif, l'objet est conservé dans le CSV brut mais exclu
  # de l'analyse et des graphiques.
  min_forward_speed_kmh: 3.0

speed:
  # 8 frames = 0,8 s à 10 Hz : le Kalman doit se stabiliser avant
  # d'afficher une vitesse. Les pistes courtes restent "en attente".
  min_samples: 8
  min_dt_s: 0.05
  # Réglages du filtre de Kalman 3D.
  process_noise: 2.0
  max_innovation_m: 2.0
  max_normalized_innovation: 4.5
  # Sigma_Z = Z²/(fB) × sigma_disparité ; le bruit augmente avec la distance.
  disparity_noise_px: 1.0
  box_center_noise_px: 2.0
  min_depth_sigma_m: 0.15
  temporal_window: 1
  # Zero-Velocity Update : pendant 4 frames sous la marge dynamique, la
  # vitesse monde est fixée à 0 plutôt que d'afficher un faux mouvement.
  zero_velocity_base_kmh: 2.5
  zero_velocity_depth_gain_kmh_per_m2: 0.025
  zero_velocity_max_kmh: 12.0
  zero_velocity_min_frames: 4
  max_speed_kmh:
    person: 25.0
    bicycle: 65.0
    cyclist: 65.0
    motorcycle: 120.0
    car: 180.0
    truck: 120.0
    bus: 110.0
